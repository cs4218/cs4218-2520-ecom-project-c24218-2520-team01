name: Run tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run backend unit tests
              run: npm run test:backend

    test-frontend-unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Install frontend dependencies
              run: npm ci --prefix ./client
            - name: Run frontend unit tests
              run: npm run test:frontend
    
    test-integration:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run integration tests
              env:
                  NODE_ENV: test
                  MONGO_URL_TEST: mongodb://127.0.0.1:27017/test
              run: npm run test:integration

    test-ui:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:7.0
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        env:
            MONGO_URL: mongodb://127.0.0.1:27017/ecommerce
            JWT_SECRET: test-jwt-secret
            DEV_MODE: test
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Wait for MongoDB to be ready
              run: |
                  node -e "
                  const { MongoClient } = require('mongodb');
                  const mongoUrl = process.env.MONGO_URL;

                  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

                  (async () => {
                    for (let attempt = 1; attempt <= 30; attempt++) {
                      const client = new MongoClient(mongoUrl, { serverSelectionTimeoutMS: 2000 });
                      try {
                        await client.connect();
                        await client.db('admin').command({ ping: 1 });
                        await client.close();
                        console.log('MongoDB is ready');
                        return;
                      } catch (error) {
                        await client.close().catch(() => {});
                        console.log(`MongoDB not ready yet (attempt ${attempt}/30)`);
                        await sleep(2000);
                      }
                    }

                    console.error('MongoDB did not become ready in time');
                    process.exit(1);
                  })();
                  "
            - name: Install frontend dependencies
              run: npm ci --prefix ./client
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
            - name: Run UI tests
              run: npm run test:ui
